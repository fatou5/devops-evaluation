name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .


  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    services:
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: error


  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build \
            --tag devops-evaluation-app:${{ github.sha }} \
            .


  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - test
      - build

    steps:
      - name: CI completed successfully
        run: echo "All CI checks passed successfully."
