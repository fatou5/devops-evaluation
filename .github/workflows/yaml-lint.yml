name: YAML Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install yamllint
        run: python3 -m pip install yamllint

      - name: Lint YAML files
        run: yamllint .
